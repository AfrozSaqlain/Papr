[workspace]
members = ["crates/papr-core", "crates/papr"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
homepage = "https://github.com/AfrozSaqlain/Papr"
repository = "https://github.com/AfrozSaqlain/Papr"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6.0"
dunce = "1.0"
futures-util = "0.3"
flate2 = "1.1"
iana-time-zone = "0.1"
notify = "8.0"
num-traits = "0.2"
quick-xml = { version = "0.38", features = ["serialize", "overlapped-lists"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "blocking", "json"] }
rusqlite = { version = "0.32", default-features = false, features = ["chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
image = "0.25.10"
pulldown-cmark = "0.13"
ratatui-image = { version = "8.1.1", features = ["crossterm", "image-defaults"] }
syntect = { version = "5.2", features = ["default-fancy"] }
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["datetime", "embedded-fonts", "scan-fonts", "system-files", "system-packages", "universe-packages"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
url = "2.5"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
