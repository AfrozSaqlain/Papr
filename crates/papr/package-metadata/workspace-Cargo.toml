[workspace]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6.0"
dunce = "1.0"
futures-util = "0.3"
flate2 = "1.1"
iana-time-zone = "0.1"
notify = "8.0"
num-traits = "0.2"
quick-xml = { version = "0.38", features = ["serialize", "overlapped-lists"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "blocking"] }
rusqlite = { version = "0.32", default-features = false, features = ["chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
image = "0.25.10"
pulldown-cmark = "0.13"
ratatui-image = { version = "8.1.1", features = ["crossterm", "image-defaults"] }
syntect = { version = "5.2", features = ["default-fancy"] }
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["datetime", "embedded-fonts", "scan-fonts", "system-files", "system-packages", "universe-packages"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
url = "2.5"
walkdir = "2.5"
