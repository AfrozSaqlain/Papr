name: Release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: papr-linux-x86_64
            binary: target/dist/papr
          - os: macos-latest
            artifact: papr-macos
            binary: target/dist/papr
          - os: windows-latest
            artifact: papr-windows-x86_64
            binary: target/dist/papr.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile dist --bin papr
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
