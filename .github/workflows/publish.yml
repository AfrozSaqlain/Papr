name: Publish Crates, Linux Packages & AUR

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish-crates-io:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p papr-core
          sleep 30
          cargo publish -p papr-tui

  publish-linux-packages:
    name: Build & Attach DEB / RPM Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
      - name: Build Release Binary
        run: cargo build --release -p papr-tui
      - name: Build DEB Package
        run: cargo deb -p papr-tui
      - name: Build RPM Package
        run: cargo generate-rpm
      - name: Upload DEB & RPM to GitHub Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  publish-aur:
    name: Publish to Arch Linux AUR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install SSH key & setup Known Hosts
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone & Update AUR Package
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Extract version without 'v' prefix (e.g. 0.1.0 from v0.1.0)
          VERSION="${GITHUB_REF_NAME#v}"
          
          # Clone AUR package repository over SSH
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git clone ssh://aur@aur.archlinux.org/papr-bin.git aur-repo || true
          
          if [ -d "aur-repo" ]; then
            cd aur-repo
            
            # Fetch latest tarball from GitHub Releases to compute exact SHA-256
            TARBALL_URL="https://github.com/AfrozSaqlain/Papr/releases/download/${GITHUB_REF_NAME}/papr-x86_64-unknown-linux-gnu.tar.gz"
            SHA256=$(curl -sL "$TARBALL_URL" | sha256sum | awk '{print $1}')
            
            if [ -n "$SHA256" ]; then
              sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
              sed -i "s/sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA256}')/" PKGBUILD
              sed -i "s/pkgver = .*/pkgver = ${VERSION}/" .SRCINFO
              sed -i "s/sha256sums_x86_64 = .*/sha256sums_x86_64 = ${SHA256}/" .SRCINFO
              
              if ! git diff --quiet; then
                git add PKGBUILD .SRCINFO
                git commit -m "Update to ${VERSION}"
                GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git push origin master
              else
                echo "No changes to commit for AUR."
              fi
            fi
          else
            echo "AUR repository papr-bin not initialized yet. Run Chapter 4 initial setup first."
          fi
