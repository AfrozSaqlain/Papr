name: Publish Crates, Linux Packages & AUR

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish-crates-io:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish Crates to Crates.io Idempotently
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_crate() {
            local CRATE="$1"
            local VERSION
            VERSION=$(cargo metadata --format-version 1 | jq -r ".packages[] | select(.name == \"${CRATE}\") | .version")
            
            echo "Checking if ${CRATE} ${VERSION} is already published on crates.io..."
            local HTTP_CODE
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: PaprCI (sqn3680@gmail.com)" "https://crates.io/api/v1/crates/${CRATE}/${VERSION}")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "${CRATE} ${VERSION} is already published. Skipping."
              return 0
            fi

            echo "Publishing ${CRATE} ${VERSION} to crates.io..."
            local OUTPUT
            if OUTPUT=$(cargo publish -p "${CRATE}" 2>&1); then
              echo "$OUTPUT"
              echo "${CRATE} ${VERSION} published successfully!"
              return 0
            else
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -q -i "already exists"; then
                echo "${CRATE} ${VERSION} already exists on crates.io index. Skipping."
                return 0
              else
                echo "Failed to publish ${CRATE} ${VERSION} due to a genuine error."
                return 1
              fi
            fi
          }

          publish_crate "papr-core"
          sleep 30
          publish_crate "papr-tui"

  publish-linux-packages:
    name: Build & Attach DEB / RPM Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
      - name: Build Release Binary
        run: cargo build --release -p papr-tui
      - name: Build DEB Package
        run: cargo deb -p papr-tui
      - name: Build RPM Package
        run: cargo generate-rpm
      - name: Upload DEB & RPM to GitHub Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  publish-aur:
    name: Publish to Arch Linux AUR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install SSH key & setup Known Hosts
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone & Update AUR Package
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Extract version without 'v' prefix (e.g. 0.1.0 from v0.1.0)
          VERSION="${GITHUB_REF_NAME#v}"
          
          echo "Waiting for GitHub Release and Linux x86_64 tarball for ${GITHUB_REF_NAME}..."
          TARBALL_URL=""
          SHA256=""

          for i in {1..30}; do
            RELEASE_JSON=$(curl -s -H "User-Agent: PaprCI (sqn3680@gmail.com)" "https://api.github.com/repos/AfrozSaqlain/Papr/releases/tags/${GITHUB_REF_NAME}")
            TARBALL_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | endswith("x86_64-unknown-linux-gnu.tar.gz")) | .browser_download_url' | head -n 1)
            
            if [ -n "$TARBALL_URL" ] && [ "$TARBALL_URL" != "null" ]; then
              echo "Found release asset: ${TARBALL_URL}"
              SHA256=$(curl -sL "$TARBALL_URL" | sha256sum | awk '{print $1}')
              if [ -n "$SHA256" ]; then
                echo "Computed SHA256: ${SHA256}"
                break
              fi
            fi
            echo "Release asset not ready yet. Waiting for release.yml to finish (attempt ${i}/30)..."
            sleep 20
          done

          if [ -z "$SHA256" ]; then
            echo "Error: Release tarball asset was not found after 10 minutes."
            exit 1
          fi

          # Clone AUR package repository over SSH
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git clone ssh://aur@aur.archlinux.org/papr-bin.git aur-repo || true
          
          if [ -d "aur-repo" ]; then
            cd aur-repo
            
            if [ ! -f "PKGBUILD" ]; then
              echo "PKGBUILD not found. Creating initial PKGBUILD and .SRCINFO for papr-bin..."
              echo "" | base64 -d > PKGBUILD
              sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" PKGBUILD
              sed -i "s/SHA256_PLACEHOLDER/${SHA256}/g" PKGBUILD

              echo "" | base64 -d > .SRCINFO
              sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" .SRCINFO
              sed -i "s/SHA256_PLACEHOLDER/${SHA256}/g" .SRCINFO
            else
              echo "Updating existing PKGBUILD and .SRCINFO..."
              sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
              sed -i "s/sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA256}')/" PKGBUILD
              sed -i "s/pkgver = .*/pkgver = ${VERSION}/" .SRCINFO
              sed -i "s/sha256sums_x86_64 = .*/sha256sums_x86_64 = ${SHA256}/" .SRCINFO
            fi
            
            if [ -n "$(git status --porcelain)" ]; then
              git add PKGBUILD .SRCINFO
              git commit -m "Release v${VERSION}"
              GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git push origin master || GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git push origin main
            else
              echo "No changes to commit for AUR."
            fi
          fi
