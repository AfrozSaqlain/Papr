name: Publish Crates, Linux Packages & AUR

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish-crates-io:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p papr-core
          sleep 30
          cargo publish -p papr-tui

  publish-linux-packages:
    name: Build & Attach DEB / RPM Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
      - name: Build Release Binary
        run: cargo build --release -p papr-tui
      - name: Build DEB Package
        run: cargo deb -p papr-tui
      - name: Build RPM Package
        run: cargo generate-rpm
      - name: Upload DEB & RPM to GitHub Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  publish-aur:
    name: Publish to Arch Linux AUR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to AUR
        uses: ksbrw/aur-release-action@v1
        with:
          package_name: papr-bin
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
