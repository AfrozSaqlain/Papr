name: Publish Crates, Linux Packages & AUR

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

jobs:
  resolve_release:
    name: Resolve completed release
    # Manual dispatch remains available for recovery; workflow_run may only
    # publish a successful Release workflow started by a v* tag push.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.tag_name }}
          fetch-depth: 0
      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            if [ "${WORKFLOW_EVENT}" != "push" ] || [[ "${WORKFLOW_HEAD_BRANCH}" != v* ]]; then
              echo "Refusing to publish: Release was not a successful v* tag push."
              exit 1
            fi
            SOURCE_REF="${WORKFLOW_SHA}"
          else
            SOURCE_REF="${MANUAL_TAG}"
          fi

          PACKAGE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "papr-tui") | .version')
          TAG_NAME="v${PACKAGE_VERSION}"
          TAG_SHA=$(git rev-list -n 1 "refs/tags/${TAG_NAME}" 2>/dev/null || true)
          if [ -z "${TAG_SHA}" ]; then
            echo "Expected release tag ${TAG_NAME} was not found."
            exit 1
          fi

          if [ "${EVENT_NAME}" = "workflow_run" ] && [ "${TAG_SHA}" != "${WORKFLOW_SHA}" ]; then
            echo "Release tag ${TAG_NAME} does not point to the completed Release workflow commit."
            exit 1
          fi

          for asset in crates/papr/README.md crates/papr/LICENSE; do
            if [ ! -f "${asset}" ]; then
              echo "Required package asset is missing from ${TAG_NAME}: ${asset}"
              exit 1
            fi
          done

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${SOURCE_REF}" >> "${GITHUB_OUTPUT}"

  publish-crates-io:
    name: Publish to Crates.io
    needs: resolve_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.source_ref }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish Crates to Crates.io Idempotently
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_crate() {
            local CRATE="$1"
            local VERSION
            VERSION=$(cargo metadata --format-version 1 | jq -r ".packages[] | select(.name == \"${CRATE}\") | .version")
            
            echo "Checking if ${CRATE} ${VERSION} is already published on crates.io..."
            local HTTP_CODE
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: PaprCI (sqn3680@gmail.com)" "https://crates.io/api/v1/crates/${CRATE}/${VERSION}")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "${CRATE} ${VERSION} is already published. Skipping."
              return 0
            fi

            echo "Publishing ${CRATE} ${VERSION} to crates.io..."
            local OUTPUT
            if OUTPUT=$(cargo publish -p "${CRATE}" 2>&1); then
              echo "$OUTPUT"
              echo "${CRATE} ${VERSION} published successfully!"
              return 0
            else
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -q -i "already exists"; then
                echo "${CRATE} ${VERSION} already exists on crates.io index. Skipping."
                return 0
              else
                echo "Failed to publish ${CRATE} ${VERSION} due to a genuine error."
                return 1
              fi
            fi
          }

          publish_crate "papr-core"
          sleep 30
          publish_crate "papr-tui"

  publish-linux-packages:
    name: Build & Attach DEB / RPM Packages
    needs: resolve_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.source_ref }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
      - name: Fetch Pre-built Release Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.resolve_release.outputs.tag_name }}"
          mkdir -p target/release
          echo "Attempting to download release binary for ${TAG_NAME}..."
          if gh release download "$TAG_NAME" --pattern "*x86_64-unknown-linux-gnu.tar.gz" --dir /tmp/release-asset 2>/dev/null; then
            echo "Found pre-built release binary. Extracting..."
            tar xf /tmp/release-asset/*x86_64-unknown-linux-gnu.tar.gz -C target/release/ --strip-components=1
            chmod +x target/release/papr
          else
            echo "Pre-built binary not found on release asset. Compiling binary..."
            cargo build --release -p papr-tui
          fi
      - name: Build DEB Package
        if: runner.os == 'Linux'
        run: cargo deb --no-build -p papr-tui
      - name: Build RPM Package
        working-directory: crates/papr
        run: cargo generate-rpm
      - name: Upload DEB & RPM to GitHub Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve_release.outputs.tag_name }}
        run: |
          shopt -s nullglob
          packages=(target/debian/*.deb target/generate-rpm/*.rpm crates/papr/target/generate-rpm/*.rpm)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No DEB or RPM package was produced."
            exit 1
          fi
          gh release upload "${TAG_NAME}" "${packages[@]}" --clobber

  publish-copr:
    name: Submit Fedora COPR build
    needs: resolve_release
    runs-on: ubuntu-latest
    # copr-cli is installed from Fedora's repositories. The COPR package is
    # configured once as an SCM package pointing at packaging/papr-tui.spec.
    container: fedora:latest
    env:
      COPR_PROJECT: ${{ vars.COPR_PROJECT }}
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      RELEASE_TAG: ${{ needs.resolve_release.outputs.tag_name }}
    steps:
      - name: Install COPR CLI
        run: dnf -y install copr-cli ca-certificates

      - name: Trigger COPR build
        shell: bash
        run: |
          set -euo pipefail
          : "${COPR_PROJECT:?Set the COPR_PROJECT repository variable (for example, owner/papr)}"
          : "${COPR_CONFIG:?Set the COPR_CONFIG repository secret to your COPR CLI configuration file}"

          mkdir -p "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"

          echo "Submitting ${RELEASE_TAG} to COPR project ${COPR_PROJECT}"
          copr build-package "$COPR_PROJECT" --name papr-tui --nowait

  publish-aur:
    name: Publish to Arch Linux AUR
    needs: resolve_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_release.outputs.source_ref }}
      
      - name: Install SSH key & setup Known Hosts
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Install makepkg
        run: |
          sudo apt-get update
          sudo apt-get install --yes pacman-package-manager

      - name: Clone & Update AUR Package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG_NAME="${{ needs.resolve_release.outputs.tag_name }}"
          # Extract version without 'v' prefix (e.g. 0.1.0 from v0.1.0)
          VERSION="${TAG_NAME#v}"
          
          echo "Waiting for GitHub Release and Linux x86_64 tarball asset for ${TAG_NAME}..."
          SHA256=""

          for i in {1..30}; do
            rm -rf /tmp/aur-asset && mkdir -p /tmp/aur-asset
            if gh release download "$TAG_NAME" --pattern "*x86_64-unknown-linux-gnu.tar.gz" --dir /tmp/aur-asset 2>/dev/null; then
              TARBALL=$(find /tmp/aur-asset -type f -name "*x86_64-unknown-linux-gnu.tar.gz" | head -n 1)
              if [ -n "$TARBALL" ] && [ -f "$TARBALL" ]; then
                SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
                echo "Downloaded release asset successfully! SHA256: ${SHA256}"
                break
              fi
            fi
            echo "Release asset not ready yet. Waiting for release.yml to finish (attempt ${i}/30)..."
            sleep 20
          done

          if [ -z "$SHA256" ]; then
            echo "Error: Release tarball asset was not found after 10 minutes."
            exit 1
          fi

          # Clone AUR package repository over SSH, retrying transient outages.
          clone_aur() {
            for attempt in {1..5}; do
              rm -rf aur-repo
              if GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes -o ConnectTimeout=15 -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
                git clone ssh://aur@aur.archlinux.org/papr-bin.git aur-repo; then
                return 0
              fi
              echo "AUR clone failed (attempt ${attempt}/5); retrying..."
              sleep $((attempt * 10))
            done
            return 1
          }

          clone_aur
          
          if [ -d "aur-repo" ]; then
            cd aur-repo
            
            echo "Writing PKGBUILD and generating .SRCINFO for papr-bin..."
            printf '%s\n' \
              '# Maintainer: Afroz Saqlain <sqn3680@gmail.com>' \
              'pkgname=papr-bin' \
              '_pkgname=papr' \
              '_crate_name=papr-tui' \
              "pkgver=${VERSION}" \
              'pkgrel=1' \
              'pkgdesc="A keyboard-first terminal workspace for academic papers"' \
              'arch=("x86_64")' \
              'url="https://github.com/AfrozSaqlain/Papr"' \
              'license=("MIT")' \
              'provides=("${_pkgname}")' \
              'conflicts=("${_pkgname}")' \
              'source_x86_64=("${url}/releases/download/v${pkgver}/${_crate_name}-x86_64-unknown-linux-gnu.tar.gz")' \
              "sha256sums_x86_64=(\"${SHA256}\")" \
              '' \
              'package() {' \
              '  find "${srcdir}" -type f -name "${_pkgname}" -exec install -Dm755 {} "${pkgdir}/usr/bin/${_pkgname}" \;' \
              '  find "${srcdir}" -type f -name "LICENSE*" -exec install -Dm644 {} "${pkgdir}/usr/share/licenses/${_pkgname}/LICENSE" \;' \
              '}' > PKGBUILD

            # Generate .SRCINFO from PKGBUILD so the metadata cannot drift.
            makepkg --printsrcinfo > .SRCINFO
            
            if [ -n "$(git status --porcelain)" ]; then
              git add PKGBUILD .SRCINFO
              git commit -m "Release v${VERSION}"
              push_aur() {
                for attempt in {1..5}; do
                  if GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes -o ConnectTimeout=15 -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
                    git push origin HEAD:master || \
                    GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes -o ConnectTimeout=15 -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
                    git push origin HEAD:main; then
                    return 0
                  fi
                  echo "AUR push failed (attempt ${attempt}/5); retrying..."
                  sleep $((attempt * 10))
                done
                return 1
              }

              push_aur
            else
              echo "No changes to commit for AUR."
            fi
          fi
